         C 254 222, 252 205, 255 180 
         C 262 215, 274 245, 286 245 
         C 294 245, 298 222, 297 198 
         C 295 180, 288 162, 288 145 
         C 292 162, 300 185, 301 210 
         C 304 252, 280 312, 256 365 Z" 
