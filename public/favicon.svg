      d="M 256 365 
         C 228 308, 224 242, 229 205 
         C 234 166, 250 134, 248 88 
         C 246 72, 242 58, 243 52 
         C 245 58, 252 80, 255 104 
         C 260 145, 248 185, 256 240 
