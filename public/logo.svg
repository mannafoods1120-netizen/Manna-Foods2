<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Permanent+Marker&amp;display=swap');
      .logo-brand-title {
        font-family: 'Permanent Marker', 'Sedgwick Ave', 'Brush Script MT', Impact, sans-serif;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: -0.5px;
        fill: #18181B;
      }
      .logo-brand-tagline {
        font-family: 'Caveat', 'Dancing Script', 'Brush Script MT', cursive;
        font-size: 32px;
        font-weight: 700;
        font-style: italic;
        fill: #18181B;
      }
    </style>
  </defs>

  <!-- Chef Hat Outline (Transparent Interior, Charcoal Brush Contour) -->
  <g id="chef-hat">
    <!-- Base inner cuff stroke -->
    <path 
      d="M 215 315 C 245 322, 280 322, 318 315" 
      fill="none" 
      stroke="#222222" 
      stroke-width="14" 
      stroke-linecap="round" 
    />

    <!-- Main Hat Silhouette Stroke -->
    <path 
      d="M 180 318 
         C 174 290, 165 262, 160 248 
         C 120 242, 110 192, 126 156 
         C 142 120, 188 126, 204 148 
         C 216 106, 244 86, 266 86 
         C 292 86, 314 106, 324 148 
         C 342 126, 386 120, 402 156 
         C 418 192, 408 242, 368 248 
         C 363 262, 354 290, 348 318 
         C 305 338, 222 338, 180 318 Z" 
      fill="none" 
      stroke="#222222" 
      stroke-width="18" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- Rising Flame (Emerging out of top of chef hat) -->
  <g id="center-flame">
    <!-- Outer Yellow Flame Backing & Contour -->
    <path 
      d="M 256 312 
         C 222 260, 218 200, 224 165 
         C 230 130, 248 100, 245 60 
         C 243 45, 238 35, 240 32 
         C 244 32, 256 50, 260 70 
         C 268 110, 252 140, 266 185 
         C 278 220, 302 185, 300 155 
         C 298 135, 288 115, 290 95 
         C 292 105, 302 130, 304 155 
         C 308 195, 282 255, 256 312 Z" 
      fill="#FFD000" 
      stroke="#FFD000" 
      stroke-width="3" 
      stroke-linejoin="round" 
    />

    <!-- Main Vibrant Red Flame Core (Left Petal) -->
    <path 
      d="M 256 308 
         C 228 258, 224 202, 229 170 
         C 234 136, 250 108, 248 68 
         C 246 54, 242 42, 243 38 
         C 245 42, 252 62, 255 82 
         C 260 118, 248 152, 256 200 
         C 260 225, 262 265, 256 308 Z" 
      fill="#E51A1A" 
    />

    <!-- Main Vibrant Red Flame Core (Right Petal) -->
    <path 
      d="M 256 308 
         C 262 265, 260 225, 256 200 
         C 254 185, 252 170, 255 150 
         C 262 180, 274 205, 286 205 
         C 294 205, 298 185, 297 165 
         C 295 150, 288 135, 288 120 
         C 292 135, 300 155, 301 175 
         C 304 212, 280 262, 256 308 Z" 
      fill="#E51A1A" 
    />

    <!-- Inner Central Yellow Accent Tongue -->
    <path 
      d="M 256 305 
         C 260 260, 256 220, 252 185 
         C 248 150, 255 118, 256 85 
         C 257 65, 252 50, 248 40 
         C 252 48, 262 70, 262 90 
         C 262 120, 254 150, 258 190 
         C 262 225, 264 265, 256 305 Z" 
      fill="#FFD700" 
    />
  </g>

  <!-- Typography: Manna Foods + Every Meal is a Happy Meal -->
  <g id="brand-typography">
    <!-- Manna Foods -->
    <text 
      x="256" 
      y="392" 
      text-anchor="middle" 
      class="logo-brand-title"
    >
      Manna Foods
    </text>

    <!-- Every Meal is a Happy Meal -->
    <text 
      x="256" 
      y="435" 
      text-anchor="middle" 
      class="logo-brand-tagline"
    >
      Every Meal is a Happy Meal
    </text>
  </g>
</svg>
